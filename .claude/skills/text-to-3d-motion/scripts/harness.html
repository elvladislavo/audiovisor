<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
<script type="importmap">
{ "imports": { "three": "/three/build/three.module.js", "three/addons/": "/three/examples/jsm/" } }
</script>
</head><body>
<script type="module">
// Frame-exact harness: the scene never sees wall-clock time, only the t we pass in.
import * as THREE from 'three';
const q = new URLSearchParams(location.search);
const width = +q.get('w') || 1920, height = +q.get('h') || 1080;
try {
  const mod = await import('/scene.js');
  const meta = { duration: 5, fps: 30, background: '#0b0d12', ...(mod.meta || {}) };
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  renderer.setSize(width, height);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(meta.background);
  const camera = new THREE.PerspectiveCamera(35, width / height, 0.1, 1000);
  camera.position.set(0, 0, 10);
  const api = await mod.setup({ THREE, renderer, scene, camera, width, height, meta, asset: p => '/assets/' + p });
  const cam = () => api?.camera || camera;
  window.__meta = meta;
  window.__frame = t => {
    api?.update?.(t);
    if (api?.render) api.render(t); else renderer.render(scene, cam());
    return renderer.domElement.toDataURL('image/png');
  };
  window.__frame(0);
  window.__ready = true;
} catch (e) {
  window.__error = (e && e.stack) || String(e);
}
</script>
</body></html>
